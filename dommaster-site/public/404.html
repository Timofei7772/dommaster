<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Страница не найдена (404) — ООО РСК ДОММАСТЕР</title>
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://timofei7772.github.io/dommaster/">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
        }
        .container {
            max-width: 500px;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 48px 32px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
        .badge {
            display: inline-block;
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
            font-weight: 700;
            font-size: 0.9rem;
            padding: 6px 16px;
            border-radius: 999px;
            margin-bottom: 20px;
        }
        h1 { font-size: 3rem; font-weight: 700; margin-bottom: 12px; letter-spacing: -0.02em; }
        p { color: #94a3b8; font-size: 1.05rem; line-height: 1.6; margin-bottom: 32px; }
        .btn {
            display: inline-block;
            background: #3b82f6;
            color: #ffffff;
            font-weight: 600;
            text-decoration: none;
            padding: 14px 32px;
            border-radius: 12px;
            transition: all 0.2s ease;
        }
        .btn:hover { background: #2563eb; transform: translateY(-2px); }
    </style>
    <script>
        // Check if URL ends with /index.html or /index.php and redirect to canonical root
        if (window.location.pathname.endsWith('/index.html') || window.location.pathname.endsWith('/index.php')) {
            window.location.replace('https://timofei7772.github.io/dommaster/');
        }
    </script>
</head>
<body>
    <div class="container">
        <div class="badge">Ошибка 404</div>
        <h1>Страница не найдена</h1>
        <p>Запрошенная страница не существует или была перемещена. Перейдите на главную страницу нашего сайта.</p>
        <a href="https://timofei7772.github.io/dommaster/" class="btn">На главную</a>
    </div>
</body>
</html>
